# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"
    ignore:
      # `npm run build` generates .d.ts files through tsup's `dts` option, which
      # is backed by rollup-plugin-dts and drives the TypeScript JS compiler API.
      # TypeScript 6 rejects the compiler options that plugin passes, and the
      # native TypeScript 7 package no longer ships the JS API at all, so either
      # major breaks the build. Drop this once tsup supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
